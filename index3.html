<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <h1>Cadastre-se</h1>
    <p>formulário destinado ao cadastro de <strong> novos doadores </strong></p>
    <form action="">
        <label for="nome">Nome:</label><br>
        <input type="text"id = nome name=" nome" placeholder="Digite seu nome aqui:"><br>
        <label for="idade">Idade</label><br>
        <input type="number" id=idade name="idade" placeholder="Digite sua idade aqui:"min="18" max="100"><br>
        <label for="e-mail">e-mail</label><br>
        <input type="email"id = e-mail name="e-mail" placeholder="Digite seu e-mail aqui:"><br>

        <label for="senha">senha</label><br>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha aqui:"><br>
        <p>comida Favorita</p>
        <input type="checkbox"> Pizza
        <input type="checkbox"> Lasanha
        <input type="checkbox"> Churrasco

        <p>Qual tipo de comida você prefere?</p>
        <input type="radio" name="vegana" id="vegana" group="comida">Vegana
        <input type="radio" name="vegetariana" id="vegetariana" group="comida">Vegetariana
        <input type="radio" name="Doce" id="Doce" group="comida">Doce
        <input type="radio" name="Carne" id="Carne" group="comida">Carne

<br>
        <input type="button" value="Entrar">
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
