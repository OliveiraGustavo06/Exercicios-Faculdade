<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="contador">
        <button type="button">-</button>
        <input type="number" value="0" readonly>
        <button type="button">+</button>
    </div>
 
    <br>
 
    <div class="contador">
        <button type="button">-</button>
        <input type="number" value="0" readonly>
        <button type="button">+</button>
    </div>
 
    <div>
        <button type="button" data-op="+">Somar</button>
        <button type="button" data-op="-">Subtrair</button>
        <button type="button" data-op="*">Multiplicar</button>
        <button type="button" data-op="/">Dividir</button>
    </div>
 
    <p>Total: <span id="total">-</span></p>
 
    <script src="script3.js"></script>
</body>
</html>
